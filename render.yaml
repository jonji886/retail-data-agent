services:
  - type: web
    name: retail-data-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: "8501"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "60"
      - key: OPENROUTER_MAX_TOKENS
        value: "1200"
      - key: OPENROUTER_HTTP_REFERER
        value: https://retail-data-agent.onrender.com
      - key: OPENROUTER_APP_TITLE
        value: Retail Data Agent
