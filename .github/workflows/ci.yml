name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare deterministic DuckDB fixture
        run: |
          python scripts/generate_data.py
          python scripts/init_db.py

      - name: Static check
        run: ruff check .

      - name: Compile check
        run: python -m compileall app

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Deterministic Golden Evaluation
        run: python scripts/run_evaluation.py

      - name: Project consistency check
        run: python scripts/verify_project_consistency.py

      - name: Smoke test
        run: python scripts/smoke_query.py
