services:
  - type: web
    name: retail-data-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: "8501"
      - key: API_PORT
        value: "8000"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      # Render 容器不需要开发态热加载；关闭 watchdog，避免低配实例触发 inotify 上限。
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: none
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: LLM_FALLBACK_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_FALLBACK_MODELS
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: EVAL_LLM_MODEL
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: OPENROUTER_MAX_TOKENS
        value: "1200"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: DATA_SOURCE
        value: postgresql
      - key: DATABASE_URL
        sync: false
      - key: DEMO_RATE_LIMIT_ENABLED
        value: "true"
      - key: DEMO_SESSION_LIMIT
        value: "10"
      - key: DEMO_IP_DAILY_LIMIT
        value: "20"
      - key: DEMO_GLOBAL_DAILY_LIMIT
        value: "40"
      - key: OPENROUTER_HTTP_REFERER
        value: https://retail-data-agent.onrender.com
      - key: OPENROUTER_APP_TITLE
        value: Retail Data Agent
