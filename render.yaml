services:
  - type: web
    name: retail-data-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: "8501"
      - key: API_PORT
        value: "8000"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      # Render 容器不需要开发态热加载；关闭 watchdog，避免低配实例触发 inotify 上限。
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: none
      - key: LLM_PROVIDER
        value: siliconflow
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: SILICONFLOW_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: ROUTER
        sync: false
      - key: MAIN
        value: deepseek-ai/DeepSeek-V4-Flash
      - key: REASON
        value: Pro/zai-org/GLM-5.1
      - key: VISION
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: EVAL_LLM_MODEL
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_MAX_TOKENS
        value: "1200"
      - key: LLM_MAX_RETRIES
        value: "1"
      - key: DATA_SOURCE
        value: postgresql
      - key: DATABASE_URL
        sync: false
      - key: DEMO_RATE_LIMIT_ENABLED
        value: "true"
      - key: DEMO_SESSION_LIMIT
        value: "10"
      - key: DEMO_IP_DAILY_LIMIT
        value: "20"
      - key: DEMO_GLOBAL_DAILY_LIMIT
        value: "40"
